# Local development database. Credentials are for local use only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openbargain
      POSTGRES_USER: openbargain
      POSTGRES_PASSWORD: openbargain
    ports:
      - "15432:5432"  # 5432 is often reserved on Windows (Hyper-V)
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
